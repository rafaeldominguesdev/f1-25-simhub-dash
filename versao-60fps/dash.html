  .gear { will-change: transform; }
  svg { display: block; position: absolute; }
  #popup { position: absolute; display: none; left: 0; top: 0; will-change: transform; }

<script>
'use strict';
// ================= CORES =================
const C = { label: '#8E8E96', white: '#FFFFFF', red: '#E10600', green: '#00E676', purple: '#B14CFF', yellow: '#FFC400',
  blue: '#2979FF', cyan: '#00E5FF', orange: '#FF8C00', grey: '#5A5A62', dark: '#2A2A30' };
const DEG = '°';
const lvl = (v, a) => v < a[0] ? 0 : v < a[1] ? 1 : v < a[2] ? 2 : 3;
const NEON = ['#2BE04F', '#FFD600', '#FF8C00', '#FF1744'];
const NEON_L = ['#8DFF9E', '#FFF27A', '#FFC070', '#FF7A8C'];
const DMG = [10, 30, 60], WEAR = [25, 50, 70];
const tempCol = (t) => t < 80 ? '#2979FF' : t <= 105 ? '#00C853' : t <= 115 ? '#FF8C00' : '#FF1744';
const tempBg = (t) => t < 80 ? '#1E4FD8' : t <= 105 ? '#1E9E4A' : t <= 115 ? '#E07800' : '#D81B3B';
const wearCol = (w) => ['#00C853', '#FFD600', '#FF8C00', '#FF1744'][lvl(w, WEAR)];
const brakeCol = (t) => t < 300 ? '#4FC3F7' : t < 800 ? '#00E676' : t < 1000 ? '#FF8C00' : '#FF1744';
const listCol = (d) => d < 15 ? '#00C853' : d < 40 ? '#FFC400' : '#FF1744';
const CMP = { 16: ['S', 'MACIO', '#FF1744'], 17: ['M', 'MEDIO', '#FFD600'], 18: ['H', 'DURO', '#F2F2F2'],
  7: ['I', 'INTER', '#00E676'], 8: ['W', 'CHUVA', '#2979FF'] };
const WX = ['LIMPO', 'POUCAS NUVENS', 'NUBLADO', 'CHUVA FRACA', 'CHUVA FORTE', 'TEMPESTADE'];

// ================= MONTAGEM (coordenadas da base 1560x720) =================
const stage = document.getElementById('stage');
function el(parent, x, y, w, h, opts = {}) {
  const d = document.createElement('div');
  d.className = 'b ' + (opts.cls || '');
  const st = d.style;
  st.left = x + 'px'; st.top = y + 'px'; st.width = w + 'px'; st.height = h + 'px';
  if (opts.size) st.fontSize = opts.size + 'px';
  if (opts.color) st.color = opts.color;
  if (opts.bg) st.background = opts.bg;
  if (opts.border) st.border = opts.border;
  if (opts.radius != null) st.borderRadius = opts.radius + 'px';
  if (opts.weight) st.fontWeight = opts.weight;
  if (opts.text != null) d.textContent = opts.text;
  parent.appendChild(d);
  return d;
}
function tile(parent, label, x, y, w, h, accent) {
  const t = el(parent, x, y, w, h, { cls: 'tile' }); t.style.borderColor = accent;
  el(parent, x + 14, y + 6, w - 28, 26, { cls: 'lbl', text: label });
  return t;
}
function bar(parent, x, y, w, h, color, bg) {
  const b = document.createElement('div'); b.className = 'bar';
  Object.assign(b.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  if (bg) b.style.background = bg;
  const i = document.createElement('i'); i.style.background = color; b.appendChild(i);
  parent.appendChild(b);
  return i;
}
function svgFrom(id, parent, x, y) {
  const s = document.getElementById(id).content.firstElementChild.cloneNode(true);
  s.style.left = x + 'px'; s.style.top = y + 'px';
  parent.appendChild(s);
  return s;
}

// atualiza so quando muda (deixa leve a 60 fps)
function T(e, v) { if (e._t !== v) { e._t = v; e.textContent = v; } }
function P(e, prop, v) { const k = '_' + prop; if (e[k] !== v) { e[k] = v; e.style[prop] = v; } }
function A(e, attr, v) { const k = '_a' + attr; if (e[k] !== v) { e[k] = v; e.setAttribute(attr, v); } }

const E = {}; // referencias
// ---------- cabecalho: menu + LEDs (iguais nas 3 telas) ----------
const screens = [0, 1, 2].map(() => { const s = document.createElement('div'); s.className = 'scr'; stage.appendChild(s); return s; });
const header = document.createElement('div'); header.className = 'scr on'; stage.appendChild(header);
E.menu = [0, 1, 2].map((k) => {
  const s = svgFrom('menuSvg', header, 8 + k * 64, 4);
  [0, 1, 2].forEach((j) => { s.querySelector('.i' + j).style.display = j === k ? '' : 'none'; });
  s.addEventListener('pointerdown', (ev) => { ev.preventDefault(); show(k); });
  return s;
});
const LEDC = ['green', 'green', 'green', 'green', 'green', 'red', 'red', 'red', 'red', 'red', 'purple', 'purple', 'purple', 'purple', 'purple'].map((c) => C[c]);
E.leds = LEDC.map((_, i) => el(header, 212 + i * 89, 8, 84, 34, { bg: '#19191E', radius: 6 }));
E.msg = el(header, 212, 8, 1340, 34, { size: 18, color: '#8E8E96', cls: 'l', bg: '#19191E', radius: 6 });
E.msg.style.paddingLeft = '14px'; E.msg.style.display = 'none';

// ---------- TELA 1: CORRIDA ----------
(function () {
  const p = screens[0];
  const LX = 8, LW = 400, CX = 416, CW = 728, RX = 1152, RW = 400;
  tile(p, 'POS', LX, 50, 196, 104, C.red);
  E.pos = el(p, LX, 74, 196, 78, { size: 52 });
  tile(p, 'VOLTA', LX + 204, 50, 196, 104, C.red);
  E.lap = el(p, LX + 204, 74, 196, 78, { size: 38 });
  tile(p, 'DELTA vs MELHOR', LX, 162, LW, 180, C.grey);
  E.delta = el(p, LX, 192, LW, 144, { size: 84 });
  tile(p, 'GAP FRENTE', LX, 350, LW, 120, C.cyan);
  E.gap = el(p, LX, 378, LW, 86, { size: 50, color: C.cyan });
  E.drs = el(p, LX, 478, LW, 113, { cls: 'tile', size: 44, text: 'DRS' });
  E.box = el(p, LX, 599, LW, 113, { cls: 'tile', size: 38, text: 'BOX' });
  E.boxSub = el(p, LX, 674, LW, 30, { size: 16, color: C.label, weight: 500 });

  E.ersTile = tile(p, 'ERS', CX, 50, CW, 104, C.yellow);
  E.ersPct = el(p, CX + CW - 200, 52, 186, 36, { size: 32, cls: 'r' });
  E.ersBar = bar(p, CX + 14, 92, CW - 28, 30, '#FFD600');
  E.ersMode = el(p, CX + 70, 54, 330, 32, { size: 22, cls: 'l' });
  E.ersUsed = el(p, CX + 14, 124, CW - 28, 26, { size: 16, cls: 'l', color: C.label });

  tile(p, 'MARCHA', CX, 162, CW, 330, C.red);
  E.gear1 = el(p, CX, 170, CW, 250, { size: 250, cls: 'gear' });
  E.speed1 = el(p, CX, 420, CW, 66, { size: 52 });
  E.warn = el(p, CX + 14, 244, 200, 34, { size: 18, cls: 'l' });
  E.pen = el(p, CX + CW - 274, 244, 260, 34, { size: 18, cls: 'r', color: '#FF1744' });

  tile(p, 'PNEUS', CX, 500, CW, 212, C.white);
  // DE, DD, TE, TD
  E.tyres = [['L', 530], ['R', 530], ['L', 620], ['R', 620]].map(([side, y]) => {
    const L = side === 'L';
    const sx = L ? CX + 22 : CX + CW - 86;
    el(p, sx, y, 64, 82, { bg: '#17171B', border: '2px solid #34343C', radius: 14 });
    // faixas da esquerda pra direita: lado esquerdo = fora/meio/dentro; direito = dentro/meio/fora
    const z = [0, 1, 2].map((k) => el(p, sx + 6 + k * 18, y + 7, 16, 68, { radius: 5, bg: '#00C853' }));
    const zones = L ? z : z.slice().reverse(); // zones[0] = fora, [1] = meio, [2] = dentro
    const temp = el(p, L ? CX + 98 : CX + CW - 238, y + 2, 140, 44, { size: 36, cls: L ? 'l' : 'r' });
    const wbar = bar(p, L ? CX + 98 : CX + CW - 194, y + 58, 96, 10, '#00C853', '#26262C');
    const wpct = el(p, L ? CX + 202 : CX + CW - 240, y + 48, 44, 30, { size: 17, cls: L ? 'l' : 'r' });
    return { zones, temp, wbar, wpct };
  });
  const tcx = CX + Math.floor(CW / 2);
  el(p, tcx - 46, 520, 92, 92, { bg: '#1B1B1F', border: '4px solid #2C2C32', radius: 46 });
  E.cmpIcon = el(p, tcx - 40, 526, 80, 80, { size: 40, bg: '#101013', border: '9px solid #8E8E96', radius: 40 });
  E.cmpTxt = el(p, CX + 230, 616, CW - 460, 34, { size: 22 });
  E.bias = el(p, CX + 230, 654, CW - 460, 50, { size: 28, color: C.cyan });

  tile(p, 'VOLTA ATUAL', RX, 50, RW, 104, C.white);
  E.cur = el(p, RX, 76, RW, 74, { size: 54 });
  tile(p, 'ULTIMA', RX, 162, RW, 96, C.yellow);
  E.last = el(p, RX, 186, RW, 68, { size: 46 });
  tile(p, 'MELHOR', RX, 266, RW, 96, C.purple);
  E.best = el(p, RX, 290, RW, 68, { size: 46, color: C.purple });
  tile(p, 'DANOS DO CARRO', RX, 370, RW, 342, C.red);
  E.dmg = [['ASA DIANT. E', 'fwl'], ['ASA DIANT. D', 'fwr'], ['ASA TRASEIRA', 'rw'], ['ASSOALHO', 'floor'],
    ['DIFUSOR', 'diff'], ['SIDEPOD', 'sidepod'], ['MOTOR', 'engine'], ['CAMBIO', 'gearbox']].map(([name, key], i) => {
    const y = 406 + i * 37;
    el(p, RX + 16, y, 240, 34, { size: 18, cls: 'l', color: '#CFCFD6', weight: 500, text: name });
    return { key, v: el(p, RX + RW - 116, y + 3, 100, 28, { size: 18, color: '#000', radius: 6 }) };
  });
})();

// ---------- TELA 2: CARRO ----------
(function () {
  const p = screens[1];
  const X = 8, Wd = 330;
  tile(p, 'MARCHA', X, 50, Wd, 250, C.red);
  E.gear2 = el(p, X, 62, Wd, 170, { size: 160, cls: 'gear' });
  E.speed2 = el(p, X, 234, Wd, 58, { size: 36 });
  tile(p, 'DELTA', X, 308, Wd, 150, C.grey);
  E.delta2 = el(p, X, 336, Wd, 116, { size: 64 });
  tile(p, 'ERS', X, 466, Wd, 120, C.yellow);
  E.ersPct2 = el(p, X + Wd - 200, 470, 186, 36, { size: 30, cls: 'r' });
  E.ersBar2 = bar(p, X + 14, 516, Wd - 28, 54, '#FFD600');
  tile(p, 'POSICAO / VOLTA', X, 594, Wd, 118, C.red);
  E.posLap = el(p, X, 622, Wd, 84, { size: 40 });

  const CarX = 346, CarW = 868, cx = CarX + CarW / 2, carL = cx - 180, carT = 66;
  tile(p, 'CARRO', CarX, 50, CarW, 662, C.dark);
  // aneis de desgaste + pontilhado (atras do carro)
  E.rings = [[cx - 290, carT + 170, cx - 222, 76], [cx + 290, carT + 170, carL + 326, 76],
    [cx - 290, carT + 526, cx - 222, 68], [cx + 290, carT + 526, carL + 334, 68]].map(([rx, ry, dx, dw]) => {
    el(p, dx, ry - 18, dw, 30, { size: 22, weight: 500, color: '#B0B0B8', text: '. . . . . .' });
    return el(p, rx - 65, ry - 65, 130, 130, { size: 36, bg: '#000', border: '9px solid #2BE04F', radius: 65 });
  });
  const svg = svgFrom('carSvg', p, carL, carT);
  E.car = {};
  svg.querySelectorAll('g.part').forEach((g) => {
    const name = g.getAttribute('data-part'), floor = name === 'Floor';
    const glow = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    glow.setAttribute('filter', 'url(#glow)');
    const els = [];
    Array.from(g.querySelectorAll('path, rect')).forEach((e) => {
      const gap = e.cloneNode(true);
      gap.setAttribute('fill', '#050506'); gap.setAttribute('stroke', '#050506');
      gap.setAttribute('stroke-width', '12'); gap.setAttribute('stroke-linejoin', 'round');
      g.insertBefore(gap, e);
      e.setAttribute('fill-opacity', floor ? '0.22' : '0.62');
      e.setAttribute('stroke-width', '4'); e.setAttribute('stroke-linejoin', 'round');
      glow.appendChild(e); els.push(e);

    g.appendChild(glow);

const lapFmt = (ms) => {
  if (!(ms > 0)) return '0:00.000';

  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(3);
};
const secFmt = (x) => {
  if (!(x > 0)) return '--.---';
  if (x < 60) return x.toFixed(3);
  const m = Math.floor(x / 60), r = x - m * 60;
  return m + ':' + (r < 10 ? '0' : '') + r.toFixed(3);
};

const hx = (v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
const mixHex = (a, b, k) => '#' + hx(a[0] + (b[0] - a[0]) * k) + hx(a[1] + (b[1] - a[1]) * k) + hx(a[2] + (b[2] - a[2]) * k);

function frame(now) {

  else if (s.sc === 1) bg = mixHex([255, 196, 0], [150, 105, 0], k);
  else if (s.sc === 2) bg = mixHex([255, 140, 0], [110, 55, 0], k);

  else if (s.fia === 3) bg = mixHex([230, 180, 0], [120, 90, 0], k);

    // pneus: fora = superficie, meio = media, dentro = carcaca
    E.tyres.forEach((t, i) => {

    T(E.cmpIcon, cmp[0]); P(E.cmpIcon, 'color', cmp[2]); P(E.cmpIcon, 'borderColor', cmp[2]);

    T(E.bias, 'BB ' + (s.bias || 0).toFixed(1));
    // tempos
    T(E.cur, lapFmt(s.curLap)); P(E.cur, 'color', s.invalid ? '#FF1744' : '#FFFFFF');
    T(E.last, lapFmt(s.lastLap));

    T(E.best, lapFmt(s.bestLap));

  } else if (cur === 1) {

    const bh = sub ? ph * 0.27 : 0, ah = ph - bh;
    const fs = Math.min(ah * 0.34, pw * 0.88 / (Math.max(t1.length, t2.length, 1) * 0.72));
    const box = (e, y, h) => { P(e, 'left', '0px'); P(e, 'width', pw + 'px'); P(e, 'top', y + 'px'); P(e, 'height', h + 'px'); };
    T(E.popT1, t1); P(E.popT1, 'color', fg); P(E.popT1, 'fontSize', fs + 'px');
    box(E.popT1, t2 ? ah * 0.08 : ah * 0.29, ah * 0.42);
    T(E.popT2, t2); P(E.popT2, 'color', fg); P(E.popT2, 'fontSize', fs + 'px'); P(E.popT2, 'display', t2 ? 'flex' : 'none');
    box(E.popT2, ah * 0.5, ah * 0.42);
    T(E.popBand, sub); P(E.popBand, 'display', sub ? 'flex' : 'none');
    P(E.popBand, 'fontSize', Math.min(bh * 0.6, pw * 0.88 / (Math.max(sub.length, 1) * 0.72)) + 'px');
    box(E.popBand, ah, bh);
  }
}
