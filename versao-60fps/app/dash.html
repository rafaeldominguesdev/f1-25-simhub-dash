<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
  @font-face { font-family: 'Saira'; src: url(fonte/saira.woff2) format('woff2'); font-weight: 100 900; font-stretch: 50% 125%; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  #stage { position: absolute; left: 0; top: 0; width: 1560px; height: 720px; transform-origin: 0 0;
    background: var(--fundo); overflow: hidden; color: var(--texto);
    font-family: 'Saira', system-ui, sans-serif; font-stretch: 125%; font-weight: 700; }
  .b { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    white-space: nowrap; overflow: hidden; line-height: 1; }
  .l { justify-content: flex-start; }
  .r { justify-content: flex-end; }
  .tile { background: var(--bloco); border: 2px solid; border-radius: 10px; }
  .lbl { color: var(--rotulo); font-size: 17px; justify-content: flex-start; letter-spacing: .3px; }
  .scr { position: absolute; inset: 0; display: none; }
  .scr.on { display: block; animation: entra .16s ease-out; }
  @keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .bar { position: absolute; background: var(--caixa2); border-radius: 6px; overflow: hidden; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; display: block; border-radius: inherit; }
  .gear { will-change: transform; }
  svg { display: block; position: absolute; }
  .menu { cursor: pointer; }
  #popup { position: absolute; display: none; left: 0; top: 0; will-change: transform; border-radius: 18px; }
  #popup.full { border-radius: 0; }
</style>
</head>

<script>
'use strict';
const PREVIA = /[?&]previa=1/.test(location.search); // miniatura dentro do app de configuracao

// ================= CONFIG (vem do PC; aqui so o padrao ate chegar) =================
let CFG = {
  tema: 'classico', destaque: '', telas: { corrida: true, carro: true, info: true }, telaInicial: 0,
  blocos: {}, avisos: { duracao: 4, amarela: true, azul: true, verde: true, sc: true, vsc: true, vermelha: true, formacao: true, som: false },
  unidades: { velocidade: 'kmh', temperatura: 'c' }, leds: 'classico', drsDistancia: true,
};
let TH = coresDoTema('classico');

// ================= CORES (tudo pelo tema: var(--nome)) =================
const V = (n) => `var(--${n})`;
const DEG = '°';
const lvl = (v, a) => v < a[0] ? 0 : v < a[1] ? 1 : v < a[2] ? 2 : 3;
const NEON = ['#2BE04F', '#FFD600', '#FF8C00', '#FF1744'];      // pecas do carro (desenho)
const NEON_L = ['#8DFF9E', '#FFF27A', '#FFC070', '#FF7A8C'];
const DMG = [10, 30, 60], WEAR = [25, 50, 70];
const tempCol = (t) => t < 80 ? V('azul') : t <= 105 ? V('verde2') : t <= 115 ? V('laranja') : V('vermelho');
const tempBg = (t) => t < 80 ? '#1E4FD8' : t <= 105 ? '#1E9E4A' : t <= 115 ? '#E07800' : '#D81B3B';
const wearCol = (w) => [V('verde2'), V('amarelo'), V('laranja'), V('vermelho')][lvl(w, WEAR)];
const brakeCol = (t) => t < 300 ? V('ciano') : t < 800 ? V('verde') : t < 1000 ? V('laranja') : V('vermelho');
const listCol = (d) => d < 15 ? V('verde2') : d < 40 ? V('amarelo2') : V('vermelho');
const CMP = { 16: ['S', 'MACIO', V('vermelho')], 17: ['M', 'MEDIO', V('amarelo')], 18: ['H', 'DURO', V('duro')],
  7: ['I', 'INTER', V('verde')], 8: ['W', 'CHUVA', V('azul')] };
const WX = ['LIMPO', 'POUCAS NUVENS', 'NUBLADO', 'CHUVA FRACA', 'CHUVA FORTE', 'TEMPESTADE'];

// unidades
const vel = (kmh) => CFG.unidades.velocidade === 'mph' ? Math.round(kmh * 0.621371) + ' MPH' : kmh + ' KM/H';
const tmp = (c) => CFG.unidades.temperatura === 'f' ? Math.round(c * 1.8 + 32) : Math.round(c);

// ================= MONTAGEM (coordenadas da base 1560x720) =================
const stage = document.getElementById('stage');
function el(parent, x, y, w, h, opts = {}) {
  const d = document.createElement('div');
  d.className = 'b ' + (opts.cls || '');
  const st = d.style;
  st.left = x + 'px'; st.top = y + 'px'; st.width = w + 'px'; st.height = h + 'px';
  if (opts.size) st.fontSize = opts.size + 'px';
  if (opts.color) st.color = opts.color;
  if (opts.bg) st.background = opts.bg;
  if (opts.border) st.border = opts.border;
  if (opts.radius != null) st.borderRadius = opts.radius + 'px';
  if (opts.weight) st.fontWeight = opts.weight;
  if (opts.text != null) d.textContent = opts.text;
  parent.appendChild(d);
  return d;
}
function tile(parent, label, x, y, w, h, accent) {
  const t = el(parent, x, y, w, h, { cls: 'tile' }); t.style.borderColor = accent;
  el(parent, x + 14, y + 6, w - 28, 26, { cls: 'lbl', text: label });
  return t;
}
function bar(parent, x, y, w, h, color) {
  const b = document.createElement('div'); b.className = 'bar';
  Object.assign(b.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  const i = document.createElement('i'); i.style.background = color; b.appendChild(i);
  parent.appendChild(b);
  return i;
}
function svgFrom(id, parent, x, y) {
  const s = document.getElementById(id).content.firstElementChild.cloneNode(true);
  s.style.left = x + 'px'; s.style.top = y + 'px';
  parent.appendChild(s);
  return s;
}
// bloco que pode ser escondido pelo app de configuracao
const BLOCOS = {};
function bloco(parent, nome) {
  const g = document.createElement('div'); parent.appendChild(g);
  (BLOCOS[nome] = BLOCOS[nome] || []).push(g);
  return g;
}

// atualiza so quando muda (deixa leve a 60 fps)
function T(e, v) { if (e._t !== v) { e._t = v; e.textContent = v; } }
function P(e, prop, v) { const k = '_' + prop; if (e[k] !== v) { e[k] = v; e.style[prop] = v; } }
const fit = (txt, maxW, base) => Math.min(base, Math.floor(maxW / (Math.max(1, txt.length) * 0.74))) + 'px';

const E = {}; // referencias
// ---------- cabecalho: menu + LEDs (iguais nas 3 telas) ----------
const screens = [0, 1, 2].map(() => { const s = document.createElement('div'); s.className = 'scr'; stage.appendChild(s); return s; });
const header = document.createElement('div'); header.className = 'scr on'; header.style.animation = 'none'; stage.appendChild(header);
E.menu = [0, 1, 2].map((k) => {
  const s = svgFrom('menuSvg', header, 8 + k * 64, 4);
  [0, 1, 2].forEach((j) => { s.querySelector('.i' + j).style.display = j === k ? '' : 'none'; });
  s.addEventListener('pointerdown', (ev) => { ev.preventDefault(); show(k); });
  return s;
});
E.leds = Array.from({ length: 15 }, (_, i) => el(header, 212 + i * 89, 8, 84, 34, { bg: V('ledoff'), radius: 6 }));
E.msg = el(header, 212, 8, 1340, 34, { size: 18, color: '#FFFFFF', bg: '#B00020', radius: 6 });
E.msg.style.display = 'none';

// ---------- TELA 1: CORRIDA ----------
(function () {
  const p = screens[0];
  const LX = 8, LW = 400, CX = 416, CW = 728, RX = 1152, RW = 400;
  tile(p, 'POS', LX, 50, 196, 104, V('destaque'));
  E.pos = el(p, LX, 74, 196, 78, { size: 52 });
  tile(p, 'VOLTA', LX + 204, 50, 196, 104, V('destaque'));
  E.lap = el(p, LX + 204, 74, 196, 78, { size: 38 });
  let g = bloco(p, 'delta');
  tile(g, 'DELTA vs MELHOR', LX, 162, LW, 180, V('cinza'));
  E.delta = el(g, LX, 192, LW, 144, { size: 84 });
  g = bloco(p, 'gap');
  tile(g, 'GAP FRENTE', LX, 350, LW, 120, V('frio'));
  E.gap = el(g, LX, 378, LW, 86, { size: 50, color: V('frio') });
  g = bloco(p, 'drs');
  E.drs = el(g, LX, 478, LW, 113, { cls: 'tile', size: 44, text: 'DRS' });
  E.drsSub = el(g, LX, 556, LW, 28, { size: 16, weight: 600 });
  g = bloco(p, 'box');
  E.box = el(g, LX, 599, LW, 113, { cls: 'tile', size: 38, text: 'BOX' });
  E.boxSub = el(g, LX, 674, LW, 30, { size: 16, color: V('rotulo'), weight: 500 });

  g = bloco(p, 'ers');
  tile(g, 'ERS', CX, 50, CW, 104, V('amarelo2'));
  E.ersPct = el(g, CX + CW - 200, 52, 186, 36, { size: 32, cls: 'r' });
  E.ersBar = bar(g, CX + 14, 92, CW - 28, 30, V('amarelo'));
  E.ersMode = el(g, CX + 70, 54, 330, 32, { size: 22, cls: 'l' });
  E.ersUsed = el(g, CX + 14, 124, CW - 28, 26, { size: 16, cls: 'l', color: V('rotulo') });

  tile(p, 'MARCHA', CX, 162, CW, 330, V('destaque'));
  E.gear1 = el(p, CX, 170, CW, 250, { size: 250, cls: 'gear' });
  E.speed1 = el(p, CX, 420, CW, 66, { size: 52 });
  E.warn = el(p, CX + 14, 244, 200, 34, { size: 18, cls: 'l' });
  E.pen = el(p, CX + CW - 274, 244, 260, 34, { size: 18, cls: 'r', color: V('vermelho') });

  g = bloco(p, 'pneus');
  tile(g, 'PNEUS', CX, 500, CW, 212, V('forte'));
  // DE, DD, TE, TD
  E.tyres = [['L', 530], ['R', 530], ['L', 620], ['R', 620]].map(([side, y]) => {
    const L = side === 'L';
    const sx = L ? CX + 22 : CX + CW - 86;
    el(g, sx, y, 64, 82, { bg: V('caixa2'), border: `2px solid ${V('borda')}`, radius: 14 });
    // faixas da esquerda pra direita: lado esquerdo = fora/meio/dentro; direito = dentro/meio/fora
    const z = [0, 1, 2].map((k) => el(g, sx + 6 + k * 18, y + 7, 16, 68, { radius: 5, bg: V('verde2') }));
    const zones = L ? z : z.slice().reverse(); // zones[0] = fora, [1] = meio, [2] = dentro
    const temp = el(g, L ? CX + 98 : CX + CW - 238, y + 2, 140, 44, { size: 36, cls: L ? 'l' : 'r' });
    const wbar = bar(g, L ? CX + 98 : CX + CW - 194, y + 58, 96, 10, V('verde2'));
    const wpct = el(g, L ? CX + 202 : CX + CW - 240, y + 48, 44, 30, { size: 17, cls: L ? 'l' : 'r' });
    return { zones, temp, wbar, wpct };
  });
  const tcx = CX + Math.floor(CW / 2);
  el(g, tcx - 46, 520, 92, 92, { bg: V('caixa2'), border: `4px solid ${V('borda')}`, radius: 46 });
  E.cmpIcon = el(g, tcx - 40, 526, 80, 80, { size: 40, bg: V('caixa'), border: `9px solid ${V('rotulo')}`, radius: 40 });
  E.cmpTxt = el(g, CX + 230, 616, CW - 460, 34, { size: 22 });
  E.bias = el(g, CX + 230, 654, CW - 460, 50, { size: 28, color: V('frio') });

  g = bloco(p, 'tempos');
  tile(g, 'VOLTA ATUAL', RX, 50, RW, 104, V('forte'));
  E.cur = el(g, RX, 76, RW, 74, { size: 54 });
  tile(g, 'ULTIMA', RX, 162, RW, 96, V('amarelo2'));
  E.last = el(g, RX, 186, RW, 68, { size: 46 });
  tile(g, 'MELHOR', RX, 266, RW, 96, V('roxo'));
  E.best = el(g, RX, 290, RW, 68, { size: 46, color: V('roxo') });
  g = bloco(p, 'danos');
  tile(g, 'DANOS DO CARRO', RX, 370, RW, 342, V('destaque'));
  E.dmg = [['ASA DIANT. E', 'fwl'], ['ASA DIANT. D', 'fwr'], ['ASA TRASEIRA', 'rw'], ['ASSOALHO', 'floor'],
    ['DIFUSOR', 'diff'], ['SIDEPOD', 'sidepod'], ['MOTOR', 'engine'], ['CAMBIO', 'gearbox']].map(([name, key], i) => {
    const y = 406 + i * 37;
    el(g, RX + 16, y, 240, 34, { size: 18, cls: 'l', color: V('texto2'), weight: 500, text: name });
    return { key, v: el(g, RX + RW - 116, y + 3, 100, 28, { size: 18, color: V('tinta'), radius: 6 }) };
  });
})();

// ---------- TELA 2: CARRO ----------
(function () {
  const p = screens[1];
  const X = 8, Wd = 330;
  tile(p, 'MARCHA', X, 50, Wd, 250, V('destaque'));
  E.gear2 = el(p, X, 62, Wd, 170, { size: 160, cls: 'gear' });
  E.speed2 = el(p, X, 234, Wd, 58, { size: 36 });
  let g = bloco(p, 'delta');
  tile(g, 'DELTA', X, 308, Wd, 150, V('cinza'));
  E.delta2 = el(g, X, 336, Wd, 116, { size: 64 });
  g = bloco(p, 'ers');
  tile(g, 'ERS', X, 466, Wd, 120, V('amarelo2'));
  E.ersPct2 = el(g, X + Wd - 200, 470, 186, 36, { size: 30, cls: 'r' });

    const cmp = CMP[s.compound] || ['?', '---', V('rotulo')];
    T(E.cmpIcon, cmp[0]); P(E.cmpIcon, 'color', cmp[2]); P(E.cmpIcon, 'borderColor', cmp[2]);
    T(E.cmpTxt, cmp[1] + ' ' + s.tyreAge + ' VOLTAS'); P(E.cmpTxt, 'color', cmp[2]);
    T(E.bias, 'BB ' + (s.bias || 0).toFixed(1));
    // tempos
    T(E.cur, lapFmt(s.curLap)); P(E.cur, 'color', s.invalid ? V('vermelho') : V('texto'));
    T(E.last, lapFmt(s.lastLap));
    P(E.last, 'color', s.bestLap > 0 && s.lastLap === s.bestLap ? V('roxo') : V('texto'));
    T(E.best, lapFmt(s.bestLap));
    E.dmg.forEach((d) => { const v = s[d.key] || 0; T(d.v, v + '%'); P(d.v, 'background', listCol(v)); });
  } else if (cur === 1) {
    T(E.speed2, vel(s.speed));
    T(E.delta2, deltaTxt); P(E.delta2, 'color', deltaCol);
    T(E.ersPct2, Math.round(ers) + '%'); P(E.ersPct2, 'color', low ? V('vermelho') : V('texto'));
    P(E.ersBar2, 'width', ers.toFixed(1) + '%');
    T(E.posLap, 'P' + s.pos + '   ' + lapStr);
    // carro: pecas mudam de cor pelo dano, pneus pelo desgaste
    setPart('Floor', lvl(s.floor, DMG)); setPart('SidepodL', lvl(s.sidepod, DMG)); setPart('SidepodR', lvl(s.sidepod, DMG));
    setPart('Engine', lvl(s.engine, DMG)); setPart('Gearbox', lvl(s.gearbox, DMG)); setPart('Diffuser', lvl(s.diff, DMG));
    setPart('RWing', lvl(s.rw, DMG)); setPart('FWingL', lvl(s.fwl, DMG)); setPart('FWingR', lvl(s.fwr, DMG));
    ['TyreFL', 'TyreFR', 'TyreRL', 'TyreRR'].forEach((n, i) => setPart(n, lvl(s.wear[i], WEAR)));
    T(E.wFL, 'ASA E ' + s.fwl + '%'); T(E.wFR, 'ASA D ' + s.fwr + '%'); T(E.wR, 'ASA TRAS. ' + s.rw + '%');
    E.rings.forEach((r, i) => { T(r, Math.round(s.wear[i]) + '%'); P(r, 'borderColor', NEON[lvl(s.wear[i], WEAR)]); });
    E.tbox.forEach((b, i) => { T(b, String(tmp(s.tyreSurf[i]))); P(b, 'background', tempBg(s.tyreSurf[i])); });
    E.calls.forEach((c) => { const v = s[c.key] || 0; T(c.v, v + '%'); P(c.v, 'color', NEON[lvl(v, DMG)]); });
    E.eng.forEach((e) => {
      const v = s[e.key] || 0, col = NEON[lvl(v, DMG)];
      P(e.bar, 'width', Math.min(100, v) + '%'); P(e.bar, 'background', col);
      T(e.v, v + '%'); P(e.v, 'color', col);
    });
    E.brakes.forEach((b, i) => { T(b.v, b.n + ' ' + tmp(s.brakeT[i]) + DEG); P(b.v, 'color', brakeCol(s.brakeT[i])); });
    E.press.forEach((b, i) => T(b.v, b.n + ' ' + (s.press[i] || 0).toFixed(1)));
  } else if (cur === 2) {
    T(E.lapsLeft, String(Math.max(0, s.totalLaps - s.lap + 1)));
    T(E.lapsSub, 'VOLTA ' + lapStr);
    const r = s.rejoin;
    T(E.rejoin, r > 0 ? 'P' + r : '--');
    P(E.rejoin, 'color', r <= 0 ? V('rotulo') : r <= s.pos + 1 ? V('verde') : r <= s.pos + 4 ? V('amarelo') : V('vermelho2'));
    T(E.rejoinSub, 'VOCE ESTA EM P' + s.pos);
    E.secs.forEach((x, i) => {
      const last = s.secLast[i], best = s.secBest[i];
      T(x.last, secFmt(last));
      P(x.last, 'color', !(last > 0) ? V('rotulo') : (best > 0 && last <= best + 0.0005) ? V('verde') : V('amarelo'));
      T(x.best, secFmt(best));
    });
    T(E.wxTemps, 'AR ' + tmp(s.air) + DEG + '   PISTA ' + tmp(s.track) + DEG);
    E.wx.forEach((c, i) => {
      const f = i === 0 ? null : s.forecast[i - 1];
      const w = i === 0 ? s.weather : f ? f.w : null;
      const rain = i === 0 ? s.rainNow : f ? f.rain : null;
      const wi = w == null ? -1 : w;
      if (c.w !== wi) {
        c.w = wi;
        const on = { 0: ['sun'], 1: ['sun', 'cloud'], 2: ['cloud'], 3: ['darkcloud', 'lightrain'],
          4: ['darkcloud', 'heavyrain'], 5: ['darkcloud', 'heavyrain', 'bolt'] }[wi] || ['sun'];
        ['sun', 'cloud', 'darkcloud', 'lightrain', 'heavyrain', 'bolt'].forEach((n) => {
          c.icon.querySelector('.' + n).style.display = on.indexOf(n) >= 0 ? '' : 'none';
        });
        c.icon.querySelector('.cloud').setAttribute('transform', wi === 2 ? 'translate(-2,-14) scale(1.08)' : '');
      }
      T(c.name, w == null ? '--' : WX[w] || '--');
      T(c.rain, rain == null ? 'CHUVA --' : 'CHUVA ' + rain + '%');
      P(c.rain, 'color', rain == null ? V('rotulo') : rain >= 50 ? '#2F8BFF' : rain >= 20 ? '#4FA8FF' : V('texto2'));
    });
  }

  // ---- aviso por cima de tudo ----
  let t1 = '', t2 = '', sub = '', pbg = '#FFD600', fg = '#000000', full = false;
  if (s.red && AV.vermelha) { t1 = 'BANDEIRA'; t2 = 'VERMELHA'; pbg = '#FF0000'; full = true; }
  else if (s.sc === 1 && AV.sc) { t1 = 'SAFETY CAR'; }
  else if (s.sc === 2 && AV.vsc) { t1 = 'VIRTUAL'; t2 = 'SAFETY CAR'; }
  else if (s.sc === 3 && AV.formacao) { t1 = 'VOLTA DE'; t2 = 'FORMACAO'; pbg = '#8E24AA'; fg = '#FFFFFF'; }
  else if (s.fia === 3 && AV.amarela) { t1 = 'BANDEIRA'; t2 = 'AMARELA'; sub = 'SETOR ' + (s.sector + 1); full = true; }
  else if (s.fia === 2 && AV.azul) { t1 = 'BANDEIRA'; t2 = 'AZUL'; pbg = '#2979FF'; fg = '#FFFFFF'; }
  else if (s.fia === 1 && AV.verde) { t1 = 'BANDEIRA'; t2 = 'VERDE'; pbg = '#00C853'; }
  const key = t1 + ' ' + t2;
  if (PK.key !== key) { PK.key = key; PK.t = now; if (t1 && AV.som) bip(); }
  const ida = now - PK.t;
  const showPop = t1 !== '' && (ida < AV.duracao * 1000 || s.red);
  P(pop, 'display', showPop ? 'block' : 'none');
  if (showPop) {
    const pk = Math.min(1, ida / 180), sc = 0.8 + 0.2 * (1 - Math.pow(1 - pk, 3));
    const pw = full ? 1560 : 1220, ph = full ? 720 : 500;
    pop.classList.toggle('full', full);
    P(pop, 'width', pw + 'px'); P(pop, 'height', ph + 'px'); P(pop, 'background', pbg);
    P(pop, 'transform', `translate(${780 - pw / 2}px, ${360 - ph / 2}px) scale(${sc.toFixed(3)})`);
    const bh = sub ? ph * 0.27 : 0, ah = ph - bh;
    const fs = Math.min(ah * 0.34, pw * 0.88 / (Math.max(t1.length, t2.length, 1) * 0.72));
    const box = (e, y, h) => { P(e, 'left', '0px'); P(e, 'width', pw + 'px'); P(e, 'top', y + 'px'); P(e, 'height', h + 'px'); };
    T(E.popT1, t1); P(E.popT1, 'color', fg); P(E.popT1, 'fontSize', fs + 'px');
    box(E.popT1, t2 ? ah * 0.08 : ah * 0.29, ah * 0.42);
    T(E.popT2, t2); P(E.popT2, 'color', fg); P(E.popT2, 'fontSize', fs + 'px'); P(E.popT2, 'display', t2 ? 'flex' : 'none');
    box(E.popT2, ah * 0.5, ah * 0.42);
    T(E.popBand, sub); P(E.popBand, 'display', sub ? 'flex' : 'none');
    P(E.popBand, 'fontSize', Math.min(bh * 0.6, pw * 0.88 / (Math.max(sub.length, 1) * 0.72)) + 'px');
    box(E.popBand, ah, bh);
  }
}

// ---- bloco do DRS. Carro 2026 nao tem DRS: mostra o modo de ultrapassagem (overtake) e a aero ativa ----
function desenharDrs(s) {
  const dist = CFG.drsDistancia;
  let txt, bg = V('bloco'), col = V('apagado'), bd = V('borda'), sub = '', subCol = V('rotulo');
  if (s.fmt === 2026 && s.reg26) {
    if (s.otActive) { txt = 'OVERTAKE'; bg = V('verde'); col = '#000000'; bd = V('verde'); }
    else if (s.otAvail) { txt = 'OVERTAKE'; col = V('verde'); bd = V('verde'); }
    else if (dist && s.otDist > 0) { txt = 'OVERTAKE ' + s.otDist + 'm'; col = V('texto'); bd = V('cinza'); }
    else txt = 'OVERTAKE';
    if (s.aeroMode === 1) { sub = 'AERO: MODO RETA'; subCol = s.otActive ? '#000000' : V('frio'); }
    else if (dist && s.aeroDist > 0) sub = 'MODO RETA EM ' + s.aeroDist + 'm';
    else sub = s.aeroAvail ? 'AERO: MODO RETA LIBERADO' : 'AERO: MODO CURVA';
  } else if (s.drsFault) { txt = 'DRS FALHA'; bg = '#4A0000'; col = V('vermelho2'); bd = V('vermelho2'); }
  else if (s.drs === 1) { txt = 'DRS ABERTO'; bg = V('verde'); col = '#000000'; bd = V('verde'); }
  else if (s.drsAllowed === 1) { txt = 'DRS'; col = V('verde'); bd = V('verde'); }
  else if (dist && s.drsDist > 0) { txt = 'DRS ' + s.drsDist + 'm'; col = V('texto'); bd = V('cinza'); }
  else txt = 'DRS';
  T(E.drs, txt); P(E.drs, 'fontSize', fit(txt, 360, 44));
  P(E.drs, 'background', bg); P(E.drs, 'color', col); P(E.drs, 'borderColor', bd);
  P(E.drs, 'paddingBottom', sub ? '22px' : '0px');
  T(E.drsSub, sub); P(E.drsSub, 'color', subCol);
}
requestAnimationFrame(frame);
