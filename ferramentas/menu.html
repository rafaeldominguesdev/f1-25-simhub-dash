<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Botoes do menu da dash F1 25 - Rafa Pro (240x168, fundo transparente).
  Uso: menu.html?i=0..2&on=0|1   (0 corrida, 1 carro/motor, 2 info)  on=1 = tela atual (destacado)
-->
<style> html, body { margin: 0; background: transparent; } svg { display: block; } </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="168" viewBox="0 0 120 84">
  <rect id="bg" x="3" y="3" width="114" height="78" rx="16" stroke-width="3"/>
  <!-- 0: corrida (velocimetro) -->
  <g id="i0" fill="none" stroke-linecap="round" stroke-width="7">
    <path d="M30,60 A30,30 0 1 1 90,60"/>
    <line x1="60" y1="56" x2="78" y2="32"/>
    <circle cx="60" cy="56" r="5" stroke-width="0" class="fillme"/>
  </g>
  <!-- 1: carro (vista de cima) -->
  <g id="i1" stroke-linejoin="round">
    <rect x="34" y="14" width="52" height="10" rx="3" class="fillme"/>
    <rect x="34" y="62" width="52" height="10" rx="3" class="fillme"/>
    <path d="M54,16 L66,16 L72,40 L72,62 L48,62 L48,40 Z" class="fillme"/>
    <rect x="30" y="26" width="12" height="18" rx="4" class="fillme"/>
    <rect x="78" y="26" width="12" height="18" rx="4" class="fillme"/>
    <rect x="28" y="48" width="14" height="20" rx="4" class="fillme"/>
    <rect x="78" y="48" width="14" height="20" rx="4" class="fillme"/>
  </g>
  <!-- 2: info -->
  <g id="i2">
    <circle cx="60" cy="42" r="28" fill="none" stroke-width="6" class="strokeme"/>
    <circle cx="60" cy="28" r="5" class="fillme"/>
    <rect x="55" y="37" width="10" height="24" rx="3" class="fillme"/>
  </g>
</svg>
<script>
  var q = new URLSearchParams(location.search);
  var i = parseInt(q.get('i') || '0', 10), on = q.get('on') === '1';
  var fg = on ? '#FFFFFF' : '#B8B8C2';
  var bg = document.getElementById('bg');
  bg.setAttribute('fill', on ? '#E10600' : '#16161B');
  bg.setAttribute('stroke', on ? '#FF5A4D' : '#3A3A44');
  [0, 1, 2].forEach(function (k) { document.getElementById('i' + k).style.display = (k === i) ? '' : 'none'; });
  var g = document.getElementById('i' + i);
  g.setAttribute('stroke', fg);
  g.querySelectorAll('.fillme').forEach(function (e) { e.setAttribute('fill', fg); });
  g.querySelectorAll('.strokeme').forEach(function (e) { e.setAttribute('stroke', fg); });
</script>
</body>
</html>
