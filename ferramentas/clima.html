<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Icones de clima proprios para a dash F1 25 - Rafa Pro (160x160, fundo transparente).
  Uso: clima.html?w=0..5  (0 limpo, 1 poucas nuvens, 2 nublado, 3 chuva fraca, 4 chuva forte, 5 tempestade)
-->
<style> html, body { margin: 0; background: transparent; } svg { display: block; } </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- sol -->
  <g id="sun" filter="url(#soft)">
    <g stroke="#FFC233" stroke-width="7" stroke-linecap="round">
      <line x1="100" y1="18" x2="100" y2="32"/><line x1="100" y1="88" x2="100" y2="102"/>
      <line x1="58" y1="60" x2="72" y2="60"/><line x1="128" y1="60" x2="142" y2="60"/>
      <line x1="70" y1="30" x2="80" y2="40"/><line x1="120" y1="80" x2="130" y2="90"/>
      <line x1="130" y1="30" x2="120" y2="40"/><line x1="80" y1="80" x2="70" y2="90"/>
    </g>
    <circle cx="100" cy="60" r="22" fill="#FFC233"/>
  </g>
  <!-- nuvem clara -->
  <g id="cloud" filter="url(#soft)">
    <path d="M40,118 C22,118 14,104 20,92 C25,82 36,79 44,82 C48,66 62,58 76,60 C90,62 99,72 101,84 C112,82 124,90 124,103 C124,113 116,118 106,118 Z" fill="#DDE6F2"/>
  </g>
  <!-- nuvem escura (chuva) -->
  <g id="darkcloud" filter="url(#soft)">
    <path d="M36,98 C18,98 10,84 16,72 C21,62 32,59 40,62 C44,46 58,38 72,40 C86,42 95,52 97,64 C108,62 120,70 120,83 C120,93 112,98 102,98 Z" fill="#8C97A8"/>
  </g>
  <g id="lightrain" stroke="#4FA8FF" stroke-width="6" stroke-linecap="round">
    <line x1="44" y1="112" x2="38" y2="128"/><line x1="72" y1="112" x2="66" y2="128"/><line x1="100" y1="112" x2="94" y2="128"/>
  </g>
  <g id="heavyrain" stroke="#2F8BFF" stroke-width="6" stroke-linecap="round">
    <line x1="36" y1="110" x2="28" y2="132"/><line x1="56" y1="110" x2="48" y2="140"/><line x1="76" y1="110" x2="68" y2="132"/>
    <line x1="96" y1="110" x2="88" y2="140"/><line x1="116" y1="110" x2="108" y2="132"/>
  </g>
  <g id="bolt"><path d="M78,100 L60,128 L76,128 L66,152 L98,118 L80,118 L92,100 Z" fill="#FFD600" stroke="#7A5A00" stroke-width="2"/></g>
</svg>
<script>
  var w = parseInt(new URLSearchParams(location.search).get('w') || '0', 10);
  var show = {
    0: ['sun'], 1: ['sun', 'cloud'], 2: ['cloud'],
    3: ['darkcloud', 'lightrain'], 4: ['darkcloud', 'heavyrain'], 5: ['darkcloud', 'heavyrain', 'bolt']
  }[w] || ['sun'];
  ['sun', 'cloud', 'darkcloud', 'lightrain', 'heavyrain', 'bolt'].forEach(function (id) {
    document.getElementById(id).style.display = show.indexOf(id) >= 0 ? '' : 'none';
  });
  // so nublado: nuvem um pouco maior e centralizada
  if (w === 2) document.getElementById('cloud').setAttribute('transform', 'translate(-2,-14) scale(1.08)');
</script>
</body>
</html>
